# ------------------------------------------------------------------------------
# OWASP CRS WordPress hardening plugin — OPTIONAL xmlrpc.php failed-login lockout
# ------------------------------------------------------------------------------
# OWASP CRS Plugin
# Plugin name: wordpress-hardening-plugin
# Plugin description: OPT-IN xmlrpc.php failed-login lockout — Apache/mod_security2
#   only, load-FATAL on Coraza. Include it explicitly; see the notes below.
# Rule ID block base: 9,522,000-9,522,999 (this file: 9522420-9522439)
# Plugin version: 1.2.0
#
# Same engine scope as wordpress-hardening-ratelimit.conf: NOT loaded by the
# standard CRS plugin loader (*-config/*-before/*-after globs) and NOT
# Coraza-compatible (persistent IP collections). It shares that file's
# collection-growth caveat (see README "IP-Based Rate Limiting").
#
# Why a separate limiter for xmlrpc.php:
#   - XML-RPC answers a failed login with HTTP 200 and a <fault> body
#     (faultCode 403, "Incorrect username or password."), so status-based
#     limiters and fail2ban on the access log cannot see the failure.
#   - system.multicall packs hundreds of login attempts into one request.
#   - block_xmlrpc=1 also breaks pingbacks, Jetpack and remote posting
#     clients. This file lets a site keep xmlrpc.php open (block_xmlrpc=0) and
#     lock out only clients that keep failing.
#
# How it works (per resolved client IP, tx.wphard.client_ip):
#   1. Phase 1, POST to */xmlrpc.php only: open the IP collection, enable
#      response body inspection and REQUEST_BODY for this request.
#   2. Phase 2: a locked-out client gets 429 (RFC 6585), like the wp-login.php
#      limiter. Other URLs are never affected.
#   3. Phase 4: a response <fault> with faultCode 403 is one failure. A failed
#      system.multicall that carries authenticated calls (wp.*, metaWeblog.*,
#      blogger.*, mt.*) reaches the threshold at once, since one such request
#      is a whole batch of guesses. pingback.*, system.listMethods etc. never
#      count, and successful logins never count.
#   4. When the failures reach tx.wphard.ratelimit_xmlrpc_failures (default 5)
#      within 300 s (fixed: expirevar cannot take a macro TTL), the client is
#      locked out of xmlrpc.php for 600 s (fixed) and 9522424 logs one line
#      that fail2ban can pick up.
#
# Requirements:
#   - wordpress-hardening-ip.conf before the main before-file (client identity
#     and private-address exemption). Without tx.wphard.client_ip the limiter
#     stays off instead of sharing one counter between all clients.
#   - "text/xml" in SecResponseBodyMimeType (it is in the ModSecurity
#     recommended config). The rules switch SecResponseBodyAccess on only for
#     POST */xmlrpc.php.
#
# Enable AFTER the plugin before-file include:
#   Include /path/to/plugins/wordpress-hardening-ratelimit-xmlrpc.conf
# Tunables: tx.wphard.ratelimit_xmlrpc_enabled (default 1 once included) and
# tx.wphard.ratelimit_xmlrpc_failures (default 5), examples 9522430/9522431 in
# wordpress-hardening-config.conf.
# ------------------------------------------------------------------------------

SecRule &TX:wphard.ratelimit_xmlrpc_enabled "@eq 0" \
  "id:9522420,\
  phase:1,\
  pass,\
  nolog,\
  setvar:tx.wphard.ratelimit_xmlrpc_enabled=1"

SecRule &TX:wphard.ratelimit_xmlrpc_failures "@eq 0" \
  "id:9522421,\
  phase:1,\
  pass,\
  nolog,\
  setvar:tx.wphard.ratelimit_xmlrpc_failures=5"

# ─── Phase 1 gates. skipAfter only skips rules of the current phase, so the
# phase 2 and phase 4 rules below test TX:wphard.xmlrpc_rl, which only the
# last gate (9522426) sets.
SecRule TX:wphard.ratelimit_xmlrpc_enabled "@eq 0" \
  "id:9522422,\
  phase:1,\
  pass,\
  nolog,\
  skipAfter:END_WPHARD_RATELIMIT_XMLRPC_GATE"

SecRule REQUEST_FILENAME "!@endsWith /xmlrpc.php" \
  "id:9522423,\
  phase:1,\
  pass,\
  nolog,\
  t:none,t:lowercase,t:normalizePath,\
  skipAfter:END_WPHARD_RATELIMIT_XMLRPC_GATE"

SecRule &TX:wphard.client_ip "@eq 0" \
  "id:9522434,\
  phase:1,\
  pass,\
  nolog,\
  skipAfter:END_WPHARD_RATELIMIT_XMLRPC_GATE"

# Private clients (localhost + RFC 1918, see wordpress-hardening-ip.conf)
SecRule TX:wphard.client_is_private "@eq 1" \
  "id:9522425,\
  phase:1,\
  pass,\
  nolog,\
  skipAfter:END_WPHARD_RATELIMIT_XMLRPC_GATE"

# Perf gate as in 9522414: the collection (SDBM on disk) and the response
# body are only needed for POST */xmlrpc.php. forceRequestBodyVariable keeps
# REQUEST_BODY available when the XML body processor is active.
SecRule REQUEST_METHOD "@streq post" \
  "id:9522426,\
  phase:1,\
  pass,\
  nolog,\
  t:none,t:lowercase,\
  initcol:ip=%{tx.wphard.client_ip},\
  ctl:responseBodyAccess=On,\
  ctl:forceRequestBodyVariable=On,\
  setvar:tx.wphard.xmlrpc_rl=1"

SecMarker "END_WPHARD_RATELIMIT_XMLRPC_GATE"

# ─── Phase 2: locked-out client → 429 on xmlrpc.php
SecRule TX:wphard.xmlrpc_rl "@eq 1" \
  "id:9522427,\
  phase:2,\
  t:none,\
  tag:'wordpress',\
  tag:'rate-limit',\
  tag:'xmlrpc',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  deny,status:429,\
  setenv:'wphard_retry_after=600',\
  logdata:'Client IP: %{tx.wphard.client_ip}, Failures: %{IP:xmlrpc_failures}',\
  msg:'Wordpress hardening: xmlrpc.php locked out after failed logins',\
  chain"
  SecRule IP:xmlrpc_locked "@eq 1" \
    "t:none,\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Phase 2: note a system.multicall that carries authenticated calls. The
# methodName may be a bare <value> or a <value><string>.
SecRule TX:wphard.xmlrpc_rl "@eq 1" \
  "id:9522428,\
  phase:2,\
  pass,\
  nolog,\
  t:none,\
  chain"
  SecRule REQUEST_BODY "@rx <methodName>\s*system\.multicall\s*</methodName>" \
    "t:none,chain"
    SecRule REQUEST_BODY "@rx <name>\s*methodName\s*</name>\s*<value>\s*(?:<string>\s*)?(?:wp|metaWeblog|blogger|mt)\." \
      "t:none,\
      setvar:tx.wphard.xmlrpc_multicall_auth=1"

# ─── Phase 4: failed login in the response (faultCode 403)
SecRule TX:wphard.xmlrpc_rl "@eq 1" \
  "id:9522429,\
  phase:4,\
  pass,\
  nolog,\
  t:none,\
  chain"
  SecRule RESPONSE_BODY "@rx <name>\s*faultCode\s*</name>\s*<value>\s*(?:<int>|<i4>)\s*403\s*(?:</int>|</i4>)" \
    "t:none,\
    setvar:tx.wphard.xmlrpc_auth_failed=1"

SecRule TX:wphard.xmlrpc_auth_failed "@eq 1" \
  "id:9522432,\
  phase:4,\
  pass,\
  nolog,\
  t:none,\
  setvar:ip.xmlrpc_failures=+1,\
  expirevar:ip.xmlrpc_failures=300"

# A failed batch of authenticated calls reaches the threshold at once
SecRule TX:wphard.xmlrpc_auth_failed "@eq 1" \
  "id:9522433,\
  phase:4,\
  pass,\
  nolog,\
  t:none,\
  chain"
  SecRule TX:wphard.xmlrpc_multicall_auth "@eq 1" \
    "t:none,\
    setvar:'ip.xmlrpc_failures=%{tx.wphard.ratelimit_xmlrpc_failures}',\
    expirevar:ip.xmlrpc_failures=300"

# Threshold reached → lock out for 600 s and log once (fail2ban hook).
# Keep pass,log: the lockout line must stay visible to operators.
#crs-linter:ignore:pass_nolog
SecRule TX:wphard.xmlrpc_rl "@eq 1" \
  "id:9522424,\
  phase:4,\
  pass,\
  log,\
  t:none,\
  tag:'wordpress',\
  tag:'rate-limit',\
  tag:'xmlrpc',\
  tag:'paranoia-level/1',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  msg:'Wordpress hardening: xmlrpc.php failed-login threshold reached, locking out',\
  logdata:'Client IP: %{tx.wphard.client_ip}, Failures: %{IP:xmlrpc_failures}, Threshold: %{tx.wphard.ratelimit_xmlrpc_failures}, Window: 300s, Lockout: 600s',\
  chain"
  SecRule IP:xmlrpc_failures "@ge %{tx.wphard.ratelimit_xmlrpc_failures}" \
    "t:none,\
    setvar:ip.xmlrpc_locked=1,\
    expirevar:ip.xmlrpc_locked=600,\
    setvar:ip.xmlrpc_failures=0"
